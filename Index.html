<script id="social-injector">
(function(){
  const FB = "https://www.facebook.com/dalin.frenchthai?locale=th_TH";
  const IG = "https://www.instagram.com/dafrenchthai.talk?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==";
  function makeIcon(href,label,isFB){
    const a=document.createElement('a');
    a.href=href; a.target="_blank"; a.rel="noopener noreferrer";
    a.setAttribute('aria-label',label);
    a.className="social-icon-btn";
    a.innerHTML = isFB
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 21v-7h2.3l.4-2.7H14v-1.7c0-.8.2-1.3 1.4-1.3h1.5V5c-.4 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4v1.9H6.5V14H9v7h5z"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';
    return a;
  }
  function inject(){
    const header = document.querySelector('header');
    if(header && !header.querySelector('.header-social')){
      const nav = header.querySelector('nav');
      if(nav){
        const wrap=document.createElement('div');
        wrap.className='header-social flex items-center gap-2 ml-4 pl-4 border-l border-slate-200';
        wrap.appendChild(makeIcon(FB,'Facebook',true));
        wrap.appendChild(makeIcon(IG,'Instagram',false));
        nav.parentNode.insertBefore(wrap, nav.nextSibling);
      }
    }
    const footer = document.querySelector('footer');
    if(footer && !footer.querySelector('.footer-social')){
      const rightCol = footer.querySelector('.flex.gap-8');
      if(rightCol){
        const col=document.createElement('div');
        col.className='grid gap-2 footer-social';
        col.innerHTML='<div class="font-bold text-[#13294B]">โซเชียล</div>';
        const row=document.createElement('div');
        row.className='flex gap-2 mt-1';
        row.appendChild(makeIcon(FB,'Facebook',true));
        row.appendChild(makeIcon(IG,'Instagram',false));
        col.appendChild(row);
        rightCol.appendChild(col);
      }
    }
    if(!document.querySelector('.social-bar-floating')){
      const bar=document.createElement('div');
      bar.className='social-bar-floating';
      bar.appendChild(makeIcon(FB,'Facebook',true));
      bar.appendChild(makeIcon(IG,'Instagram',false));
      document.body.appendChild(bar);
    }
  }
  let tries=0;
  const iv=setInterval(()=>{
    inject(); tries++;
    if(tries>30) clearInterval(iv);
    if(document.querySelector('header nav') && document.querySelector('footer')){ clearInterval(iv); }
  },500);
  document.addEventListener('DOMContentLoaded', inject);
})();
</script>
